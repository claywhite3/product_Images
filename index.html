<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engage Item Lookup</title>
<style>
:root{
  --bg:#f5f6f4; --card:#ffffff; --ink:#1c201d; --mute:#646b66; --line:#e2e5e1;
  --accent:#2f5fd0; --accent-soft:#e8eefc; --warn:#9a5b00; --warn-soft:#fff3df;
  --chip:#eef0ed; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:18px;letter-spacing:-.01em}
.mode{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;padding:6px 12px;border-radius:999px;color:var(--mute);font-size:13px;font-weight:600}
.mode button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.searchwrap{max-width:1200px;margin:10px auto 0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.search svg{flex:none;color:var(--mute)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px;padding:13px 0;color:var(--ink)}
#clear{border:0;background:transparent;color:var(--mute);font-size:22px;line-height:1;padding:4px;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{max-width:1200px;margin:8px auto 0;color:var(--mute);font-size:13px;min-height:18px}
.hint b{color:var(--ink)}
.hint button{border:0;background:none;color:var(--accent);padding:0;font-weight:600;text-decoration:underline}
main{max-width:1200px;margin:0 auto;padding:10px 16px 40px}
.layout{display:block}
body.laptop .layout{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:20px;align-items:start}
.group h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 2px 8px;font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;width:100%;color:inherit}
.row:hover{border-color:#c9cec8}
.row[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{flex:none;width:52px;height:52px;border-radius:8px;background:#f0f1ef;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#a3a9a4;font-size:10px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.meta{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink);background:var(--chip);border-radius:6px;padding:3px 7px}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.start{color:var(--mute);padding:30px 4px}
.start .ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* detail */
#detail{display:none}
body.laptop #detail{display:block;position:sticky;top:150px}
body.phone #detail.open{display:block;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px 16px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0 12px;display:none}
body.phone .back{display:inline-block}
.dimg{height:220px;display:flex;align-items:center;justify-content:center;background:#f3f4f2;border-radius:12px;overflow:hidden;color:#a3a9a4}
body.laptop .dimg{height:170px}
.dimg img{max-width:100%;max-height:100%;object-fit:contain}
.dname{font-size:20px;font-weight:700;margin:14px 0 2px;letter-spacing:-.01em}
.dsub{color:var(--mute);font-size:13.5px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--chip);color:var(--ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.bc{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 10px 8px;text-align:center}
.bc svg{width:100%;height:auto;max-height:170px}
body.laptop .bc svg{max-height:230px}
.bclabel{font-size:12px;color:var(--mute);margin-bottom:6px}
.codebig{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:4px}
.alt{margin-top:10px;font-size:13.5px;background:var(--accent-soft);color:#1f3f8f;border-radius:10px;padding:8px 10px}
.alt button{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13.5px;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{color:var(--mute);font-size:12px;margin-top:14px}
.placeholder{color:var(--mute);text-align:center;padding:60px 20px}
.tools{display:flex;align-items:center;gap:8px}
.allbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.allbtn:hover{border-color:#c9cec8}
@media (max-width:440px){h1{font-size:15px}.allbtn,.mode button{padding:6px 9px;font-size:12.5px}}
/* all-items view */
#all{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);flex-direction:column}
#all.open{display:flex}
.allhead{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.allhead .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:0 auto}
.allhead h2{margin:0;font-size:17px}
.allhead .row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1200px;margin:10px auto 0}
#af{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
#af:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.allhead select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:13.5px;background:var(--card);color:var(--ink)}
.allcount{max-width:1200px;margin:8px auto 0;color:var(--mute);font-size:13px}
.allbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;max-width:1200px;margin:0 auto;border-collapse:collapse;font-size:13.5px;background:var(--card)}
.tbl th{position:sticky;top:0;background:var(--chip);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--ink)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#fafbfa;cursor:pointer}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .mut{color:var(--mute)}
.tbl .no{color:var(--warn);font-weight:600}
body.phone .tbl .hp{display:none}
.tbl td:nth-child(2){overflow-wrap:anywhere;min-width:120px}
body.phone .tbl th,body.phone .tbl td{padding:7px 6px}
body.phone .tbl th{font-size:11px}
body.phone .tbl .num{font-size:12.5px}
body.phone #af{flex-basis:100%}
body.phone .allhead select{flex:1}
</style>
</head>
<body class="phone">
<header>
  <div class="top">
    <h1>Engage Item Lookup</h1>
    <div class="tools">
      <button class="allbtn" id="allBtn">Show all items</button>
      <div class="mode" role="group" aria-label="Display mode">
        <button id="mPhone" aria-pressed="true">Phone</button>
        <button id="mLaptop" aria-pressed="false">Laptop</button>
      </div>
    </div>
  </div>
  <div class="searchwrap">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type an item, PLU, or barcode — e.g. bagged oranges">
      <button id="clear" aria-label="Clear">×</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="hint" id="hint"></div>
</header>
<main>
  <div class="layout">
    <section id="results"></section>
    <aside id="detail" aria-live="polite"></aside>
  </div>
</main>
<div id="all" role="dialog" aria-label="All items">
  <div class="allhead">
    <div class="row1"><h2>All items</h2>
      <div class="tools"><button class="btn primary" id="csvBtn">Export CSV</button><button class="btn" id="allClose">Close</button></div></div>
    <div class="row2">
      <input id="af" type="text" autocomplete="off" spellcheck="false" placeholder="Filter by name, brand, code…">
      <select id="aType"><option value="all">All types</option><option value="loose">Loose</option><option value="bagged">Bagged</option><option value="packaged">Packaged</option><option value="store">Store-made</option></select>
      <select id="aImg"><option value="all">Photo or not</option><option value="yes">Has photo</option><option value="no">Needs photo</option></select>
    </div>
    <div class="allcount" id="aCount"></div>
  </div>
  <div class="allbody"><table class="tbl"><thead><tr id="aHead"></tr></thead><tbody id="aBody"></tbody></table></div>
</div>

/* ---------- labels ---------- */
const TYPES = {
  loose:   {label:"Loose — each or by the pound", short:"Loose"},
  bagged:  {label:"Bagged & packed produce", short:"Bagged"},
  packaged:{label:"Packaged items", short:"Packaged"},
  store:   {label:"Store-made — meat, deli, bakery", short:"Store-made"}
};
const ORDER = ["loose","bagged","packaged","store"];

/* ---------- text normalising ---------- */
const ABBR = {pto:"potato",ptos:"potato",swt:"sweet",apl:"apple",tom:"tomato",org:"organic",grn:"green",ylw:"yellow",yel:"yellow",
  wht:"white",whl:"whole",brst:"breast",ckn:"chicken",chkn:"chicken",chk:"chicken",bnls:"boneless",avo:"avocado",clem:"clementine",
  bnna:"banana",bana:"banana",ltc:"lettuce",ltce:"lettuce",cuc:"cucumber",cuke:"cucumber",pep:"pepper",ppr:"pepper",
  brc:"broccoli",caul:"cauliflower",grp:"grape",stbry:"strawberry",strw:"strawberry",blbry:"blueberry",onin:"onion",
  bkd:"baked",frsh:"fresh",lg:"large",lrg:"large",sm:"small",sml:"small",med:"medium",jmb:"jumbo",rst:"russet",
  hnycrsp:"honeycrisp",hny:"honey",grd:"ground",bf:"beef",prk:"pork",tky:"turkey",trky:"turkey",chs:"cheese",
  mlk:"milk",ygt:"yogurt",crm:"cream",sld:"salad",bnch:"bunch",bch:"bunch",rd:"red",blk:"black"};
const SYN = { // query word -> also search these
  scallion:["green onion"],scallions:["green onion"],"spring onion":["green onion"],
  cassava:["yuca"],yucca:["yuca"],manioc:["yuca"],
  cutie:["mandarin","clementine"],cuties:["mandarin","clementine"],halo:["mandarin","clementine"],halos:["mandarin","clementine"],
  tangerine:["mandarin"],clementine:["mandarin","clementine"],mandarin:["mandarin","clementine"],
  "pink lady":["pink"],"red delicious":["red delicious"],
  cilantro:["cilantro","coriander"],coriander:["cilantro"],
  yam:["sweet potato"],yams:["sweet potato"],
  zuke:["zucchini"],courgette:["zucchini"],aubergine:["eggplant"],
  capsicum:["bell pepper"],"bell":["bell"],
  garbanzo:["chickpea"],rocket:["arugula"],
  hamburger:["ground beef"],"ground chuck":["ground beef"],
  "rotisserie":["rotisserie"],"hot dog":["frank","hot dog"],"hotdog":["frank","hot dog"],
  soda:["soda","cola"],pop:["soda","cola"],
  cantelope:["cantaloupe"],canteloupe:["cantaloupe"],muskmelon:["cantaloupe"],
  "romaine hearts":["romaine heart"],"spuds":["potato"],spud:["potato"]
};
for (const k of Object.keys(SYN)) { const s=k.split(" ").map(singular).join(" "); if (!SYN[s]) SYN[s]=SYN[k]; }
const LOOSE_WORDS = new Set(["single","singles","each","ea","loose","bulk","individual","individually","per","piece","pieces","one","by"]);
const BAG_WORDS = new Set(["bag","bags","bagged","sack","sacks","bagged","net","mesh","pack","packs","package","packaged","packed","box","boxed","clamshell","clam","tray","container"]);
const UNIT = {lb:"lb",lbs:"lb",pound:"lb",pounds:"lb","#":"lb",oz:"oz",ounce:"oz",ounces:"oz",ct:"ct",count:"ct",pk:"pk"};
const STOP = new Set(["the","a","an","of","and","with","for","in","fresh","some","i","want","need","fl"]);

function singular(w){
  if (w.length>4 && w.endsWith("ies")) return w.slice(0,-3)+"y";
  if (w.length>4 && /(oes|ches|shes|sses|xes)$/.test(w)) return w.slice(0,-2);
  if (w.length>3 && w.endsWith("s") && !w.endsWith("ss") && !/(us|is)$/.test(w)) return w.slice(0,-1);
  return w;
}
function tokens(s){
  return String(s||"").toLowerCase().replace(/&/g," and ").replace(/(\d)\s*#/g,"$1 lb ").replace(/(\d)(lb|lbs|oz|ct|pk)\b/g,"$1 $2")
    .replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean).map(w=>ABBR[w]||w).map(w=>UNIT[w]||w).map(singular);
}

/* ---------- index ---------- */
const VOCAB = new Map();
for (const it of ITEMS){
  it.d = it.d||""; it.typ = it.t;
  const main = tokens(it.d + " " + (it.s||""));
  const extra = tokens((it.b||"") + " " + (it.k||"").replace(/\s+L\d\b/,"") + " " + (it.x||""));
  it._main = new Set(main); it._all = new Set([...main,...extra]);
  if (it.o) it._all.add("organic");
  it._str = " " + [...main].join(" ") + " ";
  for (const w of it._all) VOCAB.set(w,(VOCAB.get(w)||0)+(it._main.has(w)?3:1));
}
const VOCAB_LIST = [...VOCAB.keys()].filter(w=>w.length>2 && !/^\d+$/.test(w));

function dist(a,b,max){ // Damerau-Levenshtein with early exit
  if (Math.abs(a.length-b.length)>max) return max+1;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}
  for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++){let rowMin=1e9;
    for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
      rowMin=Math.min(rowMin,d[i][j]);}
    if(rowMin>max)return max+1;}
  return d[a.length][b.length];
}
function known(w){ if (VOCAB.has(w)) return true; for (const v of VOCAB_LIST) if (v.startsWith(w)) return true; return false; }
function correct(w){
  if (w.length<4 || /\d/.test(w) || known(w)) return w;
  const max = w.length>=7?2:1; let best=null,bd=9,bf=0;
  for (const v of VOCAB_LIST){ const dd=dist(w,v.slice(0,Math.max(w.length,Math.min(v.length,w.length+1))),max);
    const full=dist(w,v,max); const x=Math.min(dd,full);
    if (x<=max){ const f=VOCAB.get(v); if (x<bd || (x===bd && f>bf)){best=v;bd=x;bf=f;} } }
  return best||w;
}

/* ---------- search ---------- */
function parse(q,forceJoin){
  let raw = q.toLowerCase().trim();
  const intent = {loose:false,bag:false,organic:null};
  if (/\b(per|by the|a)\s+(pound|lb)\b/.test(raw)) { intent.loose=true; raw=raw.replace(/\b(per|by the|a)\s+(pound|lb)\b/g," "); }
  if (/\b\d+(\.\d+)?\s*(lb|lbs|pound|pounds|#|oz|ct|count|pk)\b/.test(raw) || /\d+\s*#/.test(raw)) intent.bag=true;
  if (/\b(non[- ]?organic|conventional|regular)\b/.test(raw)) { intent.organic=false; raw=raw.replace(/\b(non[- ]?organic|conventional|regular)\b/g," "); }
  // phrase synonyms
  const groups=[];
  for (const [k,alts] of Object.entries(SYN)) if (k.includes(" ") && raw.includes(k)) { groups.push([k,...alts].map(tokens)); raw=raw.replace(k," "); }
  let words = tokens(raw);
  // join split compounds ("honey crisp" -> honeycrisp, "water melon" -> watermelon)
  for (let i=0;i<words.length-1;i++){ const j=words[i]+words[i+1], js=singular(j);
    const cj=(VOCAB.get(j)||0)+(VOCAB.get(js)||0);
    const bothKnown = !forceJoin && VOCAB.has(words[i]) && VOCAB.has(words[i+1]) && (VOCAB.get(words[i])||0)+(VOCAB.get(words[i+1])||0) > cj*3;
    if (cj && !bothKnown){ words.splice(i,2,VOCAB.has(j)?j:js); } }
  const out=[]; const fixes=[];
  for (const w of words){
    if (w==="organic"){ intent.organic=true; continue; }
    if (LOOSE_WORDS.has(w)){ intent.loose=true; if (VOCAB.has(w)) out.push({soft:true,alts:[[w]]}); continue; }
    if (BAG_WORDS.has(w)){ intent.bag=true; continue; }
    if (STOP.has(w)) continue;
    if (["lb","oz","ct","pk"].includes(w) || /^\d+$/.test(w)) { out.push({soft:true,alts:[[w]]}); continue; }
    const fixed = SYN[w] ? w : correct(w);
    if (fixed!==w) fixes.push([w,fixed]);
    const alts=[[fixed]]; if (SYN[fixed]) for (const a of SYN[fixed]) alts.push(tokens(a));
    out.push({soft:false,alts});
  }
  for (const g of groups) out.push({soft:false,alts:g});
  return {terms:out,intent,fixes};
}
function matchAlt(it,alt){ // alt = array of tokens that must all appear
  let s=0;
  for (const t of alt){
    if (it._main.has(t)) s+=4;
    else if ([...it._main].some(w=>w.startsWith(t) && t.length>=2)) s+=3;
    else if (it._all.has(t)) s+=1.5;
    else if ([...it._all].some(w=>w.startsWith(t) && t.length>=3)) s+=1;
    else return 0;
  }
  return s;
}
function search(q,_retry){
  q=q.trim(); if (!q) return {list:[],fixes:[],intent:{}};
  const digits=q.replace(/\D/g,"");
  if (digits.length>=3 && digits.length===q.replace(/\s/g,"").length){
    const t=digits.replace(/^0+/,"");
    const hits=ITEMS.filter(it=>it.c.startsWith(t)||(it.a&&it.a.startsWith(t))||(it.i&&it.i.replace(/^PLU_/,"").replace(/^0+/,"").startsWith(t))
      || (t.length>=12 && it.c===t.slice(0,-1)));
    hits.sort((a,b)=>(a.c===t?-1:0)-(b.c===t?-1:0)||b.n-a.n);
    return {list:hits.slice(0,60),fixes:[],intent:{}};
  }
  const {terms,intent,fixes}=parse(q,_retry);
  const hard=terms.filter(t=>!t.soft);
  let res=[];
  for (const it of ITEMS){
    if (intent.organic===true && !it.o) continue;
    if (intent.organic===false && it.o) continue;
    let score=0, ok=true;
    for (const term of hard){ let best=0; for (const a of term.alts) best=Math.max(best,matchAlt(it,a)); if(!best){ok=false;break;} score+=best; }
    if (!ok) continue;
    for (const term of terms.filter(t=>t.soft)) for (const a of term.alts) if (matchAlt(it,a)) score+=1.5;
    if (!hard.length && !intent.organic) continue;
    if (intent.loose) score += it.t==="loose"?8:-2;
    if (intent.bag)   score += (it.t==="bagged"||it.t==="packaged")?6:(it.t==="loose"?-3:0);
    if (it.o && intent.organic!==true) score-=1.5;
    score += Math.log10(it.n+1)*0.8;
    if (!it.n && !it.z) score-=3;
    res.push([score,it]);
  }
  res.sort((a,b)=>b[0]-a[0]);
  if (!_retry && res.length<3 && /\s/.test(q.trim())){
    const alt=search(q,true); if (alt.list.length>res.length) return alt;
  }
  return {list:res.slice(0,80).map(r=>r[1]),fixes,intent};
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const state={type:"all",sel:null,last:[]};
const CHIPS=[["all","All"],["loose","Loose"],["bagged","Bagged"],["packaged","Packaged"],["store","Store-made"]];
$("chips").innerHTML=CHIPS.map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest(".chip"); if(!b)return; state.type=b.dataset.k;
  for(const c of $("chips").children)c.setAttribute("aria-pressed",c===b); render();};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function imgSrc(it){return it.i? IMG_BASE+it.i+".png":"";}
function cat(it){return (it.k||"").replace(/\s+L\d\b/,"");}
function subline(it){return [it.b && !/unbrand/i.test(it.b)?it.b:"", it.s, cat(it)].filter(Boolean).join(" · ");}
function thumb(it){return it.i?`<img loading="lazy" src="${imgSrc(it)}" alt="" onerror="this.replaceWith(document.createTextNode('no photo'))">`:"no photo";}

function render(){
  const q=$("q").value;
  $("clear").style.display=q?"block":"none";
  const {list,fixes,intent}=search(q);
  let shown = state.type==="all"?list:list.filter(it=>it.t===state.type);
  state.last=[];
  
  // hint
  let h="";
  if (fixes.length) h+=`Showing results for <b>${esc(fixes.map(f=>f[1]).join(", "))}</b> (you typed ${esc(fixes.map(f=>f[0]).join(", "))}). `;
  const tags=[]; if(intent&&intent.loose)tags.push("loose / each"); if(intent&&intent.bag)tags.push("bagged"); if(intent&&intent.organic===true)tags.push("organic only"); if(intent&&intent.organic===false)tags.push("non-organic");
  if (tags.length) h+=`Looking for: <b>${tags.join(", ")}</b>.`;
  if (q && shown.length) h += ` ${shown.length}${shown.length>=80?"+":""} matches.`;
  $("hint").innerHTML=h;
  const R=$("results");
  if (!q.trim()){
    R.innerHTML=`<div class="start">Search by what it is — you don't need the PLU or barcode.
      <div class="ex">${["bagged oranges","single avocado","sweet potato 3 lb","organic bananas","green onions","rotisserie chicken","4011"].map(x=>`<button class="chip ex-q">${x}</button>`).join("")}</div>
      <p style="margin-top:14px">${ITEMS.length.toLocaleString()} items · ${ITEMS.filter(i=>i.i).length} with photos</p></div>`;
    R.querySelectorAll(".ex-q").forEach(b=>b.onclick=()=>{$("q").value=b.textContent;render();$("q").focus();});
    if (document.body.classList.contains("laptop") && !state.sel) $("detail").innerHTML=`<div class="card placeholder">Pick an item to show its barcode.</div>`;
    return;
  }
  if (!shown.length){
    const sugg = q.trim().split(/\s+/).map(w=>correct(singular(w.toLowerCase()))).join(" ");
    R.innerHTML=`<div class="empty">No matches.${sugg && sugg!==q.toLowerCase()?` Try <button class="btn" id="sugg">${esc(sugg)}</button>`:""}<br><br>Tip: try one word, like <b>onion</b> or <b>lettuce</b>.</div>`;
    const s=$("sugg"); if(s) s.onclick=()=>{$("q").value=sugg;render();};
    return;
  }
  const groups={}; for(const it of shown)(groups[it.t]=groups[it.t]||[]).push(it);
  const order = (intent&&intent.bag)?["bagged","packaged","loose","store"]:ORDER;
  state.last = order.flatMap(t=>groups[t]||[]);
  R.innerHTML=order.filter(t=>groups[t]).map(t=>`<div class="group"><h2>${TYPES[t].label} · ${groups[t].length}</h2><div class="list">${
    groups[t].map(it=>`<button class="row" data-c="${esc(it.c)}" aria-current="${state.sel===it.c}">
      <span class="thumb">${thumb(it)}</span>
      <span class="meta"><div class="name">${esc(it.d)}</div><div class="sub">${esc(subline(it))}</div></span>
      <span class="code">${esc(it.c)}</span></button>`).join("")}</div></div>`).join("");
  if (document.body.classList.contains("laptop")){
    const first = order.filter(t=>groups[t]).map(t=>groups[t][0])[0];
    if (!state.sel || !shown.some(i=>i.c===state.sel)) select(first.c,false);
  }
}
$("results").onclick=e=>{const r=e.target.closest(".row"); if(r) select(r.dataset.c,true);};

const BY = new Map(ITEMS.map(i=>[i.c,i]));
function select(code,open){
  const it=BY.get(code); if(!it) return;
  state.sel=code;
  document.querySelectorAll(".row").forEach(r=>r.setAttribute("aria-current",r.dataset.c===code));
  const badges=[];
  badges.push(`<span class="badge">${TYPES[it.t].short}</span>`);
  if (it.o) badges.push(`<span class="badge blue">Organic</span>`);
  if (it.z) badges.push(`<span class="badge warn">${esc(it.z)} — may show "item not found"</span>`);
  else if (it.n<50) badges.push(`<span class="badge warn">In few stores — may show "item not found"</span>`);
  if (!it.i) badges.push(`<span class="badge warn">Needs photo</span>`);
  const altItem = it.a && BY.get(it.a);
  const D=$("detail");
  D.innerHTML=`<button class="back" id="back">‹ Back to results</button>
   <div class="card">
    <div class="dimg">${it.i?`<img src="${imgSrc(it)}" alt="${esc(it.d)}" onerror="this.replaceWith(document.createTextNode('Photo not uploaded yet'))">`:"No photo yet"}</div>
    <div class="dname">${esc(it.d)}</div>
    <div class="dsub">${esc(subline(it))}${it.n?` · ${it.n.toLocaleString()} stores`:""}</div>
    <div class="badges">${badges.join("")}</div>
    <div class="bc"><div class="bclabel">Scan this with the app</div><svg id="bcsvg"></svg><div class="codebig">${esc(it.c)}</div></div>
    ${it.a?`<div class="alt">Also keyed as <b>${esc(it.a)}</b>${altItem?` — <button id="altbtn">show that barcode</button>`:""}. If one says "item not found", try the other.</div>`:""}
    <div class="actions">
      <button class="btn primary" id="copy">Copy code</button>
      ${it.i?`<button class="btn" id="copyimg">Copy image link</button>`:""}
    </div>
    <div class="foot">Image: ${it.i?esc(it.i+".png"):"—"}</div>
   </div>`;
  const laptop=document.body.classList.contains("laptop");
  try{ JsBarcode("#bcsvg", it.c, {format:"CODE128", width:laptop?3:2.4, height:laptop?130:100, displayValue:false, margin:12, background:"#ffffff"}); }
  catch(e){ $("bcsvg").outerHTML=`<div class="empty">Could not draw barcode</div>`; }
  $("copy").onclick=()=>copy(it.c,$("copy"));
  if (it.i) $("copyimg").onclick=()=>copy(IMG_BASE+it.i+".png",$("copyimg"));
  if (altItem) $("altbtn").onclick=()=>select(it.a,true);
  $("back").onclick=closeDetail;
  if (!laptop && open){ D.classList.add("open"); D.scrollTop=0; history.pushState({d:1},""); }
}
function closeDetail(){ $("detail").classList.remove("open"); if (history.state&&history.state.d) history.back(); }
window.onpopstate=()=>$("detail").classList.remove("open");
function copy(t,btn){
  const done=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1200);};
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done,()=>{prompt("Copy:",t);});
  else prompt("Copy:",t);
}


/* ---------- all items + CSV ---------- */
const COLS=[ // key, header, value fn, phone-hidden, numeric
  ["c","Code",it=>it.c,0,0],
  ["d","Description",it=>it.d,0,0],
  ["s","Size",it=>it.s||"",1,0],
  ["b","Brand",it=>it.b||"",1,0],
  ["k","Category",it=>cat(it),1,0],
  ["t","Type",it=>TYPES[it.t].short,0,0],
  ["n","Stores",it=>it.n||0,1,1],
  ["i","Photo",it=>it.i?"Yes":"No",0,0]];
const all={sort:"t",dir:1,rows:[]};
function allFilter(){
  const words=tokens($("af").value), ty=$("aType").value, im=$("aImg").value, raw=$("af").value.replace(/\D/g,"");
  let rows=ITEMS.filter(it=>(ty==="all"||it.t===ty)&&(im==="all"||(im==="yes")===!!it.i)&&
    (!words.length||words.every(w=>it._all.has(w)||[...it._all].some(x=>x.startsWith(w))||it.c.includes(w)||(it.a&&it.a.includes(w)))));
  const col=COLS.find(c=>c[0]===all.sort), f=col[2], d=all.dir, tOrd=t=>ORDER.indexOf(t);
  rows.sort((a,b)=>{ let x,y; if(all.sort==="t"){x=tOrd(a.t);y=tOrd(b.t);} else {x=f(a);y=f(b);}
    const r = col[4]||all.sort==="t" ? x-y : String(x).localeCompare(String(y),undefined,{numeric:true});
    return r*d || a.d.localeCompare(b.d); });
  all.rows=rows; return rows;
}
function allRender(){
  const rows=allFilter();
  $("aHead").innerHTML=COLS.map(c=>`<th data-k="${c[0]}" class="${c[3]?"hp":""}${c[4]?" r":""}"${all.sort===c[0]?` data-dir="${all.dir>0?"▲":"▼"}"`:""}>${c[1]}</th>`).join("");
  const withImg=rows.filter(i=>i.i).length;
  $("aCount").textContent=`${rows.length.toLocaleString()} of ${ITEMS.length.toLocaleString()} items · ${withImg.toLocaleString()} with photos · tap a row to see its barcode`;
  $("csvBtn").textContent=`Export ${rows.length.toLocaleString()} to CSV`;
  $("aBody").innerHTML=rows.map(it=>`<tr data-c="${esc(it.c)}">${COLS.map(c=>{const v=c[2](it);
    const cls=[c[3]?"hp":"",c[0]==="c"?"num":"",c[4]?"r":"",c[0]==="i"&&v==="No"?"no":"",(c[0]==="s"||c[0]==="k")?"mut":""].filter(Boolean).join(" ");
    return `<td${cls?` class="${cls}"`:""}>${esc(c[4]?Number(v).toLocaleString():v)}</td>`;}).join("")}</tr>`).join("");
}
function openAll(){ $("all").classList.add("open"); document.body.style.overflow="hidden"; allRender(); history.pushState({a:1},""); }
function closeAll(){ $("all").classList.remove("open"); document.body.style.overflow=""; if(history.state&&history.state.a) history.back(); }
$("allBtn").onclick=openAll; $("allClose").onclick=closeAll;
let at; $("af").addEventListener("input",()=>{clearTimeout(at);at=setTimeout(allRender,150);});
$("aType").onchange=allRender; $("aImg").onchange=allRender;
$("aHead").onclick=e=>{const th=e.target.closest("th"); if(!th)return; const k=th.dataset.k;
  if(all.sort===k) all.dir=-all.dir; else {all.sort=k; all.dir=k==="n"?-1:1;} allRender();};
$("aBody").onclick=e=>{const tr=e.target.closest("tr"); if(!tr)return; const code=tr.dataset.c;
  $("all").classList.remove("open"); document.body.style.overflow="";
  const it=BY.get(code); $("q").value=it.c; state.sel=null; render(); select(code,true);};
$("csvBtn").onclick=()=>{
  const head=["Code","Alt Code","Description","Size","Brand","Category","Type","Organic","Stores","Has Photo","Image File","Image Link","Note"];
  const q=v=>{v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[head.join(",")].concat(all.rows.map(it=>[it.c,it.a||"",it.d,it.s||"",it.b||"",cat(it),TYPES[it.t].short,it.o?"Yes":"No",it.n||0,
    it.i?"Yes":"No",it.i?it.i+".png":"",it.i?IMG_BASE+it.i+".png":"",it.z||""].map(q).join(",")));
  // ="..." keeps Excel from dropping leading zeros / using scientific notation on codes
  const csv="﻿"+lines.map((l,i)=>i?l.replace(/^([^,]*),([^,]*),/,(m,a,b)=>`="${a}",${b?`="${b}"`:""},`):l).join("\r\n");
  const ty=$("aType").value, d=new Date().toISOString().slice(0,10);
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`engage-items${ty!=="all"?"-"+ty:""}-${d}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
};
window.addEventListener("popstate",()=>{ if($("all").classList.contains("open")&&!(history.state&&history.state.a)){$("all").classList.remove("open");document.body.style.overflow="";} });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("all").classList.contains("open")) closeAll(); });

/* ---------- mode ---------- */
function setMode(m){
  document.body.className=m;
  $("mPhone").setAttribute("aria-pressed",m==="phone"); $("mLaptop").setAttribute("aria-pressed",m==="laptop");
  $("detail").classList.remove("open");
  try{localStorage.setItem("engageLookupMode",m);}catch(e){}
  render(); if (state.sel) select(state.sel,false);
}
$("mPhone").onclick=()=>setMode("phone"); $("mLaptop").onclick=()=>setMode("laptop");

let t; $("q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(render,120);});
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter" && state.last[0]){ select(state.last[0].c,true); $("q").blur(); } });
$("clear").onclick=()=>{$("q").value="";state.sel=null;render();$("q").focus();};
let start="phone"; try{start=new URLSearchParams(location.search).get("mode")||localStorage.getItem("engageLookupMode")||"phone";}catch(e){}
setMode(start==="laptop"?"laptop":"phone");
</script>
